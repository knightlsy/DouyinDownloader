# 2G 对 R8 不够了：加完跨进程共享那几个类之后，minifyReleaseWithR8 阶段
# java.lang.OutOfMemoryError: Java heap space。4G 与抖仙人仓库保持一致。
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# libxposed 102 要求 compileSdk 37，AGP 8.9 官方只认到 35。
# 实际编译能过，只是会报「未测试」警告，这里显式压掉。
android.suppressUnsupportedCompileSdk=37
