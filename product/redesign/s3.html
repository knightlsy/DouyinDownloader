<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.screen{width:393px;height:852px;position:relative;overflow:hidden;background:#0C0B0A;isolation:isolate}

/* ══ 玻璃（参数已验证为实时重采样，保持不变）══ */
.g{position:relative;background:rgba(255,255,255,.042);
   -webkit-backdrop-filter:blur(34px) saturate(165%) brightness(1.10);
   backdrop-filter:blur(34px) saturate(165%) brightness(1.10);
   border:1px solid rgba(255,255,255,.09);
   box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.30),inset 0 -1px 0 rgba(0,0,0,.26)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
   background:radial-gradient(130% 90% at 50% -25%,rgba(255,255,255,.17),transparent 58%)}
.g-heavy{background:rgba(255,255,255,.072);
   -webkit-backdrop-filter:blur(46px) saturate(175%) brightness(1.14);
   backdrop-filter:blur(46px) saturate(175%) brightness(1.14)}
.g-light{position:relative;background:rgba(255,255,255,.42);
   -webkit-backdrop-filter:blur(34px) saturate(200%) brightness(1.0);
   backdrop-filter:blur(34px) saturate(200%) brightness(1.0);
   border:1px solid rgba(255,255,255,.72);
   box-shadow:0 10px 34px rgba(60,40,20,.10),inset 0 1.5px 0 rgba(255,255,255,1),inset 0 -1px 0 rgba(0,0,0,.04)}
.g-light::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
   background:radial-gradient(130% 90% at 50% -25%,rgba(255,255,255,.55),transparent 58%)}

/* ══ 背景：只 2 层，全部暖色，无紫蓝 ══ */
.bg{position:absolute;inset:0;z-index:0;
  background:
   radial-gradient(62% 46% at 26% 14%,#C4652B 0%,transparent 66%),
   radial-gradient(58% 44% at 78% 76%,#8A4A1E 0%,transparent 68%),
   linear-gradient(168deg,#151210 0%,#0C0B0A 100%)}
.bg.soft{opacity:.72}
.glow{position:absolute;border-radius:50%;filter:blur(58px);pointer-events:none}

.sb{position:relative;z-index:3;display:flex;justify-content:space-between;padding:15px 22px 8px;
    font-size:13px;font-weight:600;color:rgba(255,255,255,.9)}

/* ══ 占位符：斜纹 + monospace 标签（不再用彩色渐变冒充图）══ */
.ph{position:relative;overflow:hidden;background:
     repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 5px,transparent 5px 10px),#1C1917;
     border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center}
.ph span{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10px;letter-spacing:.4px;
     color:rgba(255,255,255,.30);text-transform:uppercase}

/* ══ 顶栏 ══ */
.topglass{position:absolute;left:12px;right:12px;top:52px;z-index:4;border-radius:22px;padding:14px 18px;
          display:flex;align-items:center;justify-content:space-between}
.ttl{font-size:17px;font-weight:650;color:#fff;letter-spacing:-.2px}
.tsub{font-size:11.5px;color:rgba(255,255,255,.52);margin-top:2px}
.ghostbtn{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
     font-size:13px;font-weight:600;color:rgba(255,255,255,.62);padding:0 12px;border-radius:14px;
     background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10)}

/* ══ 输入 ══ */
.inputcard{border-radius:24px;padding:18px}
.inputrow{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.20);border-radius:16px;
          padding:15px 16px;border:1px solid rgba(255,255,255,.06);min-height:52px}
.inputph{flex:1;font-size:14px;color:rgba(255,255,255,.44)}
.paste{font-size:13px;font-weight:600;color:rgba(255,255,255,.60);white-space:nowrap;padding:6px 0}

/* ══ 按钮：触控全部 ≥48 ══ */
.btn{border:none;border-radius:18px;font-size:16px;font-weight:650;letter-spacing:.1px;
     display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;
     color:#fff;font-family:inherit}
.btn-tint{background:#FF7A3A;color:#1A0E06;
  box-shadow:0 8px 26px rgba(255,122,58,.28),inset 0 1px 0 rgba(255,255,255,.30)}
.btn-glass{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.btn-off{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.28)}

/* ══ 列表 ══ */
.row{display:flex;align-items:center;gap:13px;padding:13px 0;min-height:60px}
.row+.row{border-top:1px solid rgba(255,255,255,.06)}
.rname{font-size:15px;font-weight:500;color:#F2EFEC;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rmeta{font-size:12px;color:#A39C95;margin-top:3px}

/* ══ 底部 Tab：纯文字 + 指示线，无图标 ══ */
.tabbar{position:absolute;left:16px;right:16px;bottom:20px;z-index:5;border-radius:26px;display:flex;padding:8px;gap:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
     min-height:56px;border-radius:19px;position:relative}
.tab .tl{font-size:13px;color:rgba(255,255,255,.42);font-weight:500;letter-spacing:.2px}
.tab.on .tl{color:#fff;font-weight:650}
.tab.on::before{content:"";position:absolute;top:9px;width:18px;height:2px;border-radius:1px;background:#FF7A3A}
.tab.on{background:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}

/* ══ 播放：CSS 三角，不画 SVG ══ */
.tri{width:0;height:0;border-left:13px solid rgba(255,255,255,.9);
      border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
