<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"SF Pro Display","SF Pro Text","PingFang SC","Noto Sans SC",system-ui,sans-serif;
     -webkit-font-smoothing:antialiased}
.screen{width:393px;height:852px;position:relative;overflow:hidden;background:#0A0E12;isolation:isolate}

/* ══ 深色玻璃：alpha 压到 0.042、blur 34、saturate 165（不是 190，避免霓虹）══ */
.g{position:relative;background:rgba(255,255,255,.042);
   -webkit-backdrop-filter:blur(34px) saturate(165%) brightness(1.10);
   backdrop-filter:blur(34px) saturate(165%) brightness(1.10);
   border:1px solid rgba(255,255,255,.13);
   box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(0,0,0,.26)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
   background:radial-gradient(130% 90% at 50% -25%,rgba(255,255,255,.18),transparent 58%)}
.g-heavy{background:rgba(255,255,255,.072);
   -webkit-backdrop-filter:blur(46px) saturate(175%) brightness(1.14);
   backdrop-filter:blur(46px) saturate(175%) brightness(1.14)}

/* ══ 浅色玻璃：单独调参 —— alpha 0.42、不提亮、靠饱和度透色、阴影减淡、内高光加强 ══ */
.g-light{position:relative;background:rgba(255,255,255,.42);
   -webkit-backdrop-filter:blur(34px) saturate(200%) brightness(1.0);
   backdrop-filter:blur(34px) saturate(200%) brightness(1.0);
   border:1px solid rgba(255,255,255,.72);
   box-shadow:0 10px 34px rgba(20,30,40,.10),inset 0 1.5px 0 rgba(255,255,255,1),inset 0 -1px 0 rgba(0,0,0,.04)}
.g-light::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
   background:radial-gradient(130% 90% at 50% -25%,rgba(255,255,255,.55),transparent 58%)}

.bgcontent{position:absolute;inset:0;z-index:0}
.fluid{position:absolute;inset:0;
  background:
   radial-gradient(58% 42% at 24% 16%,#FF8A4C 0%,transparent 62%),
   radial-gradient(52% 38% at 80% 10%,#B44BC8 0%,transparent 58%),
   radial-gradient(66% 48% at 64% 74%,#2FA8B8 0%,transparent 64%),
   radial-gradient(44% 32% at 12% 80%,#1E3A42 0%,transparent 60%),
   linear-gradient(170deg,#151E27 0%,#0A0E12 100%)}
.fluid.mask{-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 92%);
            mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 92%)}
.glow{position:absolute;border-radius:50%;filter:blur(56px);pointer-events:none}

.sb{position:relative;z-index:3;display:flex;justify-content:space-between;padding:15px 22px 8px;
    font-size:13px;font-weight:600;color:rgba(255,255,255,.92)}
.label{font-size:11px;font-weight:600;color:rgba(255,255,255,.45);letter-spacing:1px;text-transform:uppercase}

.topglass{position:absolute;left:12px;right:12px;top:52px;z-index:4;border-radius:22px;padding:14px 18px;
          display:flex;align-items:center;justify-content:space-between}
.topglass .t{font-size:17px;font-weight:600;color:#fff;letter-spacing:-.2px}
.icn{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;
     font-size:17px;color:rgba(255,255,255,.85);background:rgba(255,255,255,.09);
     border:1px solid rgba(255,255,255,.12)}

.inputcard{position:relative;z-index:2;border-radius:24px;padding:18px}
.inputrow{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.20);border-radius:16px;
          padding:14px 16px;border:1px solid rgba(255,255,255,.07)}
.inputph{flex:1;font-size:14px;color:rgba(255,255,255,.45)}
.paste{font-size:13px;font-weight:600;color:rgba(255,255,255,.62);white-space:nowrap}

.btn{border:none;border-radius:18px;font-size:16px;font-weight:600;letter-spacing:.1px;
     display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;
     color:#fff;font-family:inherit}
.btn-tint{background:linear-gradient(180deg,#FF7A3A,#E4561A);border:1px solid rgba(255,255,255,.24);
  box-shadow:0 8px 26px rgba(255,111,44,.32),inset 0 1px 0 rgba(255,255,255,.42)}
.btn-glass{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.17);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24)}
.btn-off{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.30)}

.row{display:flex;align-items:center;gap:13px;padding:13px 0}
.row+.row{border-top:1px solid rgba(255,255,255,.07)}
.thumb{width:50px;height:50px;border-radius:15px;flex:none}
.rname{font-size:15px;font-weight:500;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rmeta{font-size:12px;color:rgba(255,255,255,.50);margin-top:3px}
.chev{color:rgba(255,255,255,.28);font-size:18px;margin-left:auto;flex:none}

.tabbar{position:absolute;left:16px;right:16px;bottom:20px;z-index:5;border-radius:26px;display:flex;padding:9px;gap:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0;border-radius:19px;
     min-height:56px;justify-content:center}
.tab .ti{font-size:19px;line-height:1;color:rgba(255,255,255,.45)}
.tab .tl{font-size:10.5px;color:rgba(255,255,255,.45);font-weight:500;letter-spacing:.2px}
.tab.on{background:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.tab.on .ti,.tab.on .tl{color:#fff}
.tab.on .tl{font-weight:600}
</style></head><body style="margin:0;background:#000;display:flex;justify-content:center;padding:20px"><div class="screen">
 <div class="bgcontent"><div class="fluid"></div>
  <div class="glow" style="width:310px;height:310px;left:-80px;top:170px;background:rgba(255,138,76,.44)"></div>
  <div class="glow" style="width:290px;height:290px;right:-90px;bottom:110px;background:rgba(47,168,184,.40)"></div></div>
 <div class="sb" style="color:rgba(255,255,255,.92)"><span>9:41</span><span>▮▮▮ ⌁ ▰</span></div>
 <div style="position:absolute;left:16px;top:56px;z-index:4">
  <div class="icn g" style="border-radius:50%;width:42px;height:42px;background:rgba(255,255,255,.09)">‹</div></div>
 <div style="position:absolute;left:0;right:0;top:158px;z-index:2;text-align:center">
  <div style="display:inline-flex;align-items:center;justify-content:center;width:68px;height:68px;border-radius:50%;
   background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);
   -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:22px;color:#fff">▶</div>
  <div style="margin-top:14px;font-size:11.5px;color:rgba(255,255,255,.58);letter-spacing:.5px">00:15 · 1080P · 4.2 MB</div></div>
 <div class="g-heavy g" style="position:absolute;left:16px;right:16px;bottom:20px;z-index:4;border-radius:28px;padding:22px 20px">
  <div style="font-size:19px;font-weight:650;line-height:1.4;color:#fff;letter-spacing:-.3px">
   成都人民公园的银杏黄了，比往年早了十天</div>
  <div style="font-size:13px;color:rgba(255,255,255,.58);margin-top:8px">@成都小队长</div>
  <div style="display:flex;gap:10px;margin-top:20px">
   <button class="btn btn-glass" style="flex:0 0 36%">播放</button>
   <button class="btn btn-tint" style="flex:1">下载视频</button></div></div>
</div></body></html>
