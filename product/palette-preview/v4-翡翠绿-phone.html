      <div style="color:#6E6E6E;font-size:10px;letter-spacing:1.4px;font-weight:600;margin-bottom:9px">预览</div>
      <div class="preview">
        <div class="thumb" style="background:#131313;border-radius:4px">
          <span style="color:#00E384;font-size:22px;opacity:.9">▶</span><span class="dur">00:15</span>

  <div style="flex:1"></div>
