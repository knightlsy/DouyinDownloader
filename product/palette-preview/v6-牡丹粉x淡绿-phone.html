<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>


*{margin:0;padding:0;box-sizing:border-box}

.phone{width:411px;height:914px;overflow:hidden;display:flex;flex-direction:column;position:relative;
       background:#16161A;color:#F4F1F3}

        <span style="color:#61AC85;font-size:12px;font-weight:700;white-space:nowrap;padding:4px 2px">粘贴</span>
      </div>

    </div>

    <div style="background:#1F1F25;border:1px solid #34343D;border-radius:10px;padding:19px">
      <div style="display:flex;justify-content:space-between">
        <div><div class="num" style="color:#F4F1F3">28</div><div class="cap" style="color:#8A858C">今日</div></div>
        <div><div class="num" style="color:#61AC85">26</div><div class="cap" style="color:#8A858C">成功</div></div>
        <div><div class="num" style="color:#E05C6E;opacity:.85">2</div><div class="cap" style="color:#8A858C">失败</div></div>

    <div style="background:#1F1F25;border:1px solid #34343D;border-radius:10px;padding:19px">
      <div style="color:#8A858C;font-size:10px;letter-spacing:1.4px;font-weight:600;margin-bottom:9px">预览</div>
      <div class="preview">
        <div class="thumb" style="background:#28282F;border:2px solid #61AC85;border-radius:10px">
          <span style="color:#61AC85;font-size:24px">▶</span><span class="dur">00:15</span>
        </div>
        <div class="pinfo">
          <div class="ptitle" style="color:#F4F1F3;font-size:13px;line-height:1.4">成都人民公园银杏黄了，比往年早十天</div>
          <div style="color:#8A858C;font-size:11px;margin-top:6px">@成都小队长 · 4.2MB</div>
        </div>
      </div>
      <div class="qualities" style="margin-top:15px">
        <span class="q" style="border:1.5px solid #61AC85;color:#61AC85;border-radius:10px">1080P</span>
        <span class="q" style="border:1px solid #34343D;color:#8A858C;border-radius:10px">720P</span>
        <span class="q" style="border:1px solid #34343D;color:#8A858C;border-radius:10px">540P</span>
      </div>
      <button class="cta2" style="border:1.5px solid #FFA6C9;color:#FFA6C9;border-radius:10px;margin-top:15px">下载视频</button>
    </div>

    <div style="background:#1F1F25;border:1px solid #34343D;border-radius:10px;padding:19px">
      <div style="color:#8A858C;font-size:10px;letter-spacing:1.4px;font-weight:600;margin-bottom:9px">任务</div>

    </div>
