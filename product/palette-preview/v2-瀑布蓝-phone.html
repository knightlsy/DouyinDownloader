<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>


*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.phone{width:411px;height:914px;overflow:hidden;display:flex;flex-direction:column;position:relative;
       background:#0A0A0A;color:#EDEDED}
html,body{margin:0;padding:0}
</style></head><body><div class="phone">
<div class="statusbar"><span>9:41</span><span>▮▮▮ ⌁ ▰</span></div>
<div class="app">
  <div class="apphead">
    <div>
      <div style="font-size:23px;font-weight:300;letter-spacing:.6px;color:#EDEDED">抖音下载器</div>
      <div style="color:#767676;font-size:11px;margin-top:4px;letter-spacing:.2px">粘贴链接 · 解析 · 下载</div>
    </div>
    <div class="themebtn" style="border:1px solid #242424;color:#767676;border-radius:0px">◐</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:18px">
    <div style="padding:16px 0;border-bottom:1px solid #242424">
      <div style="color:#767676;font-size:10px;letter-spacing:1.4px;font-weight:600;margin-bottom:9px">链接</div>
      <div class="inputrow" style="background:#161616;border:1px solid #242424;border-radius:0px">
        <span style="color:#EDEDED;opacity:.55;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">https://v.douyin.com/iRxK8vQf/</span>
        <span style="color:#51C4D3;font-size:11px;font-weight:700;white-space:nowrap">粘贴</span>
      </div>
      <button class="cta" style="background:#51C4D3;color:#111111;border-radius:0px;margin-top:18px">解析</button>
    </div>

    <div style="padding:16px 0;border-bottom:1px solid #242424">
      <div style="display:flex;justify-content:space-between;text-align:left">
        <div><div class="num" style="color:#EDEDED">28</div><div class="cap" style="color:#767676">今日</div></div>
        <div><div class="num" style="color:#51C4D3">26</div><div class="cap" style="color:#767676">成功</div></div>
        <div><div class="num" style="color:#E5544F">2</div><div class="cap" style="color:#767676">失败</div></div>
        
      </div>
    </div>

    <div style="padding:16px 0;border-bottom:1px solid #242424">
      <div style="color:#767676;font-size:10px;letter-spacing:1.4px;font-weight:600;margin-bottom:9px">预览</div>
      <div class="preview">
        <div class="thumb" style="background:#161616;border-radius:0px">
          <span style="color:#51C4D3;font-size:22px;opacity:.9">▶</span><span class="dur">00:15</span>
        </div>
        <div class="pinfo">
          <div class="ptitle" style="color:#EDEDED;font-size:13px;line-height:1.4">成都人民公园银杏黄了，比往年早十天</div>
          <div style="color:#767676;font-size:11px;margin-top:6px">@成都小队长 · 4.2MB</div>
        </div>
      </div>
      <div class="qualities" style="margin-top:18px">
        <span class="q" style="border:1px solid #51C4D3;color:#51C4D3;border-radius:0px">1080P</span>
        <span class="q" style="border:1px solid #242424;color:#767676;border-radius:0px">720P</span>
        <span class="q" style="border:1px solid #242424;color:#767676;border-radius:0px">540P</span>
      </div>
      <button class="cta" style="background:#51C4D3;color:#111111;border-radius:0px;margin-top:18px">下载视频</button>
    </div>

    <div style="padding:16px 0;border-bottom:1px solid #242424">
      <div style="color:#767676;font-size:10px;letter-spacing:1.4px;font-weight:600;margin-bottom:9px">任务</div>
      <div class="task"><div class="tname" style="color:#EDEDED">银杏.mp4</div><div class="tstate" style="color:#51C4D3">62%</div></div>
      <div class="bar" style="background:#161616;border-radius:0px"><i style="width:62%;background:#51C4D3;border-radius:0px"></i></div>
      <div class="task" style="margin-top:18px"><div class="tname" style="color:#EDEDED">熊猫基地.mp4</div><div class="tstate" style="color:#51C4D3">已完成</div></div>
      <div class="task" style="margin-top:10px"><div class="tname" style="color:#EDEDED">图集 9 张.jpg</div><div class="tstate" style="color:#E5544F">失败</div></div>
    </div>
  </div>

  <div style="flex:1"></div>
  <div class="bottombar" style="color:#767676;border-top:1px solid #242424;margin-top:18px">
    <span style="color:#51C4D3">● 首页</span><span>历史</span><span>日志</span><span>设置</span>
  </div>
</div></div></body></html>
