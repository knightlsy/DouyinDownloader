<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>


*{margin:0;padding:0;box-sizing:border-box}

.phone{width:411px;height:914px;overflow:hidden;display:flex;flex-direction:column;position:relative;
       background:#0A0A0F;color:#F2F2F5}
html,body{margin:0;padding:0}
</style></head><body><div class="phone"><div class="app">
<div class="statusbar"><span>9:41</span><span>▮▮▮ ⌁ ▰</span></div>
<div class="app">
  <div class="apphead">
    <div>
      <div style="600 29px/1.15;color:#F2F2F5">抖音下载器</div>
      <div style="color:#85858F;font-size:11px;margin-top:4px">粘贴链接 · 解析 · 下载</div>
    </div>
    <div class="themebtn" style="border:1px solid #26262F;color:#85858F;border-radius:3px">◐</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="background:#12121A;border:1px solid #26262F;border-radius:3px;padding:18px">
      <div style="color:#85858F;font-size:10px;letter-spacing:1.4px;font-weight:600;margin-bottom:9px">链接</div>
      <div class="inputrow" style="background:#1A1A24;border:1px solid #26262F;border-radius:3px">
        <span style="color:#F2F2F5;opacity:.6;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">https://v.douyin.com/iRxK8vQf/</span>
        <span style="color:#002EFF;font-size:12px;font-weight:700;white-space:nowrap;padding:4px 2px">粘贴</span>
      </div>
      <button class="cta" style="background:#FF0000;color:#111111;border-radius:3px;margin-top:14px">解析</button>
    </div>

    <div style="background:#12121A;border:1px solid #26262F;border-radius:3px;padding:18px">
      <div style="display:flex;justify-content:space-between">
        <div><div class="num" style="color:#F2F2F5">28</div><div class="cap" style="color:#85858F">今日</div></div>
        <div><div class="num" style="color:#002EFF">26</div><div class="cap" style="color:#85858F">成功</div></div>
        <div><div class="num" style="color:#FF7A45;opacity:.85">2</div><div class="cap" style="color:#85858F">失败</div></div>
      </div>
    </div>

    <div style="background:#12121A;border:1px solid #26262F;border-radius:3px;padding:18px">
      <div style="color:#85858F;font-size:10px;letter-spacing:1.4px;font-weight:600;margin-bottom:9px">预览</div>
      <div class="preview">
        <div class="thumb" style="background:#1A1A24;border:2px solid #002EFF;border-radius:3px">
          <span style="color:#002EFF;font-size:24px">▶</span><span class="dur">00:15</span>
        </div>
        <div class="pinfo">
          <div class="ptitle" style="color:#F2F2F5;font-size:13px;line-height:1.4">成都人民公园银杏黄了，比往年早十天</div>
          <div style="color:#85858F;font-size:11px;margin-top:6px">@成都小队长 · 4.2MB</div>
        </div>
      </div>
      <div class="qualities" style="margin-top:14px">
        <span class="q" style="border:1.5px solid #002EFF;color:#002EFF;border-radius:3px">1080P</span>
        <span class="q" style="border:1px solid #26262F;color:#85858F;border-radius:3px">720P</span>
        <span class="q" style="border:1px solid #26262F;color:#85858F;border-radius:3px">540P</span>
      </div>
      <button class="cta2" style="border:1.5px solid #FF0000;color:#FF0000;border-radius:3px;margin-top:14px">下载视频</button>
    </div>

    <div style="background:#12121A;border:1px solid #26262F;border-radius:3px;padding:18px">
      <div style="color:#85858F;font-size:10px;letter-spacing:1.4px;font-weight:600;margin-bottom:9px">任务</div>
      <div class="task"><div class="tname" style="color:#F2F2F5">银杏.mp4</div><div class="tstate" style="color:#FF0000">62%</div></div>
      <div class="bar" style="background:#1A1A24;border-radius:3px"><i style="width:62%;background:#FF0000;border-radius:3px"></i></div>
      <div class="task" style="margin-top:14px"><div class="tname" style="color:#F2F2F5">熊猫基地.mp4</div><div class="tstate" style="color:#002EFF">✓ 已完成</div></div>
      <div class="task" style="margin-top:10px"><div class="tname" style="color:#F2F2F5">图集 9 张.jpg</div><div class="tstate" style="color:#FF7A45">✕ 失败</div></div>
    </div>
  </div>

  <div style="flex:1"></div>
  <div class="bottombar" style="color:#85858F;border-top:1px solid #26262F;margin-top:18px">
    <span style="color:#FF0000">● 首页</span><span>历史</span><span>日志</span><span>设置</span>
  </div>
</div></div></div></body></html>
