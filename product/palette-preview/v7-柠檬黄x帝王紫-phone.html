<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>


*{margin:0;padding:0;box-sizing:border-box}

       background:#0A0A10;color:#F2F2F6}

      <div style="color:#7A7A8C;font-size:10px;letter-spacing:1.4px;font-weight:600;margin-bottom:9px">预览</div>
      <div class="preview">
        <div class="thumb" style="background:#1B1B26;border:2px solid #7B2CBF;border-radius:2px">
          <span style="color:#7B2CBF;font-size:24px">▶</span><span class="dur">00:15</span>

          <div class="ptitle" style="color:#F2F2F6;font-size:13px;line-height:1.4">成都人民公园银杏黄了，比往年早十天</div>

        </div>
      </div>
      <div class="qualities" style="margin-top:13px">
        <span class="q" style="border:1.5px solid #7B2CBF;color:#7B2CBF;border-radius:2px">1080P</span>
        <span class="q" style="border:1px solid #26263A;color:#7A7A8C;border-radius:2px">720P</span>
        <span class="q" style="border:1px solid #26263A;color:#7A7A8C;border-radius:2px">540P</span>
      </div>
      <button class="cta2" style="border:1.5px solid #FFF000;color:#FFF000;border-radius:2px;margin-top:13px">下载视频</button>
    </div>

    <div style="background:#13131C;border:1px solid #26263A;border-radius:2px;padding:17px">
      <div style="color:#7A7A8C;font-size:10px;letter-spacing:1.4px;font-weight:600;margin-bottom:9px">任务</div>
      <div class="task"><div class="tname" style="color:#F2F2F6">银杏.mp4</div><div class="tstate" style="color:#FFF000">62%</div></div>
      <div class="bar" style="background:#1B1B26;border-radius:2px"><i style="width:62%;background:#FFF000;border-radius:2px"></i></div>
