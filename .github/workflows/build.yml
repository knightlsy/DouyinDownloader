name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          # 云端同步接口密钥：不写进源码，从仓库 Secrets 注入 BuildConfig
          DOUYIN_SYNC_API_URL: ${{ secrets.DOUYIN_SYNC_API_URL }}
          DOUYIN_SYNC_API_KEY: ${{ secrets.DOUYIN_SYNC_API_KEY }}
        run: |
          set -o pipefail
          if [ -z "$DOUYIN_SYNC_API_KEY" ]; then
            echo "::warning::DOUYIN_SYNC_API_KEY 未配置 —— 本次构建将不含云端同步（本地功能不受影响）"
          fi
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build_output.log

      - name: Show compile errors
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "(^e: |error:|FAILURE|What went wrong)" -A 3 build_output.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -60 build_output.log >> "$GITHUB_STEP_SUMMARY"
          # 把完整日志推到 error-report 分支供远程诊断
          git config user.name "ci-bot"
          git config user.email "ci@local"
          git checkout --orphan error-report
          git rm -rf --cached . -q || true
          git add -f build_output.log
          git commit -m "build log"
          git push -f origin error-report || true

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" app-release-v${GITHUB_REF_NAME#v}.apk || cp "$APK" app-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release*.apk
          # 手写更新日志：不使用自动生成（避免把内部实现细节带进用户可见的说明里）
          generate_release_notes: false
          body: |
            更新内容：

            · 全新应用图标：品牌渐变底色，播放与下载融合的图形
            · 界面重新设计：顶栏、统计区、卡片层次全面打磨
            · 浅色模式过渡更自然，不再有生硬的区块分界
            · 下载进度改为环形显示，不再重复出现两条进度
            · 统计区改为四宫格，数字与图标更清晰易读
            · 视频下载统一取最高清晰度，不再需要手动选画质
            · 图集支持列表模式，可网格浏览、整屏查看、双指缩放
            · 机型显示为真实型号名称
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
