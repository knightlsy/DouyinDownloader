name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew


      - name: Restore signing key
        env:
          # 固定签名密钥：base64 存在 Secrets 里，构建时还原成 release-key.jks。
          # 不这么做的话，每个 runner 都会生成新的 ~/.android/debug.keystore，
          # 导致每个版本的签名都不同 —— 用户每次升级都得先卸载重装。
          DOUYIN_KEYSTORE_B64: ${{ secrets.DOUYIN_KEYSTORE_B64 }}
        run: |
          if [ -n "$DOUYIN_KEYSTORE_B64" ]; then
            echo "$DOUYIN_KEYSTORE_B64" | base64 -d > release-key.jks
            echo "::notice::已恢复固定签名密钥（$(stat -c%s release-key.jks) 字节）"
          else
            echo "::error::DOUYIN_KEYSTORE_B64 未配置 —— release 构建将因缺少签名密钥直接失败（build.gradle.kts 已禁止回退 debug 签名）"
          fi

      - name: Verify tag/version consistency
        # 只在 tag 触发时校验，push 到分支的日常构建不受影响。
        # 防的是：忘 bump / bump 错 versionName 时 tag 照样发版，出现比线上更低的
        # versionCode 会触发 INSTALL_FAILED_VERSION_DOWNGRADE，配合强制更新弹窗
        # 会把用户锁死在旧版进不去、新版装不上。
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          GRADLE_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$GRADLE_VERSION" ] || [ -z "$GRADLE_CODE" ]; then
            echo "::error::无法从 app/build.gradle.kts 解析 versionName/versionCode，请检查 defaultConfig 写法"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::tag 版本 ($TAG_VERSION) 与 versionName ($GRADLE_VERSION) 不一致 —— 忘记 bump 还是 bump 错了？低 versionCode 会触发 INSTALL_FAILED_VERSION_DOWNGRADE，禁止发版"
            exit 1
          fi
          echo "::notice::版本一致: tag=$GITHUB_REF_NAME versionName=$GRADLE_VERSION versionCode=$GRADLE_CODE"

      - name: Build release APK
        env:
          # 云端同步接口密钥：不写进源码，从仓库 Secrets 注入 BuildConfig
          DOUYIN_SYNC_API_URL: ${{ secrets.DOUYIN_SYNC_API_URL }}
          DOUYIN_SYNC_API_KEY: ${{ secrets.DOUYIN_SYNC_API_KEY }}
          # 签名密钥口令（build.gradle.kts 从这两个环境变量读）
          DOUYIN_STORE_PASSWORD: ${{ secrets.DOUYIN_STORE_PASSWORD }}
          DOUYIN_KEY_PASSWORD: ${{ secrets.DOUYIN_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -z "$DOUYIN_SYNC_API_KEY" ]; then
            echo "::warning::DOUYIN_SYNC_API_KEY 未配置 —— 本次构建将不含云端同步（本地功能不受影响）"
          fi
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build_output.log

      - name: Show compile errors
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "(^e: |error:|FAILURE|What went wrong)" -A 3 build_output.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -60 build_output.log >> "$GITHUB_STEP_SUMMARY"
          # 把完整日志推到 error-report 分支供远程诊断
          git config user.name "ci-bot"
          git config user.email "ci@local"
          git checkout --orphan error-report
          git rm -rf --cached . -q || true
          git add -f build_output.log
          git commit -m "build log"
          git push -f origin error-report || true

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" app-release-v${GITHUB_REF_NAME#v}.apk || cp "$APK" app-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release*.apk
          # 手写更新日志，手动维护在 RELEASE_NOTES.md。
          # 之前是写死在这段 YAML 里的 —— 发版时忘了改，用户看到的还是 v1.7 的内容。
          # 改成 body_path 后，发版只需要改 RELEASE_NOTES.md，版本控制里也有记录。
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
