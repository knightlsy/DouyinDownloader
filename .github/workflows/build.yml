name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          # 固定签名密钥：base64 存在 Secrets 里，构建时还原成 release-key.jks。
          # 不这么做的话，每个 runner 都会生成新的 ~/.android/debug.keystore，
          # 导致每个版本的签名都不同 —— 用户每次升级都得先卸载重装。
          DOUYIN_KEYSTORE_B64: ${{ secrets.DOUYIN_KEYSTORE_B64 }}
        run: |
          if [ -n "$DOUYIN_KEYSTORE_B64" ]; then
            echo "$DOUYIN_KEYSTORE_B64" | base64 -d > release-key.jks
            echo "::notice::已恢复固定签名密钥（$(stat -c%s release-key.jks) 字节）"
          else
            echo "::warning::DOUYIN_KEYSTORE_B64 未配置 —— 本次将使用 debug 签名，产物无法覆盖升级"
          fi

      - name: Build release APK
        env:
          # 云端同步接口密钥：不写进源码，从仓库 Secrets 注入 BuildConfig
          DOUYIN_SYNC_API_URL: ${{ secrets.DOUYIN_SYNC_API_URL }}
          DOUYIN_SYNC_API_KEY: ${{ secrets.DOUYIN_SYNC_API_KEY }}
          # 签名密钥口令（build.gradle.kts 从这两个环境变量读）
          DOUYIN_STORE_PASSWORD: ${{ secrets.DOUYIN_STORE_PASSWORD }}
          DOUYIN_KEY_PASSWORD: ${{ secrets.DOUYIN_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -z "$DOUYIN_SYNC_API_KEY" ]; then
            echo "::warning::DOUYIN_SYNC_API_KEY 未配置 —— 本次构建将不含云端同步（本地功能不受影响）"
          fi
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build_output.log

      - name: Show compile errors
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "(^e: |error:|FAILURE|What went wrong)" -A 3 build_output.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -60 build_output.log >> "$GITHUB_STEP_SUMMARY"
          # 把完整日志推到 error-report 分支供远程诊断
          git config user.name "ci-bot"
          git config user.email "ci@local"
          git checkout --orphan error-report
          git rm -rf --cached . -q || true
          git add -f build_output.log
          git commit -m "build log"
          git push -f origin error-report || true

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" app-release-v${GITHUB_REF_NAME#v}.apk || cp "$APK" app-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release*.apk
          # 手写更新日志：不使用自动生成（避免把内部实现细节带进用户可见的说明里）
          generate_release_notes: false
          body: |
            更新内容：

            · 界面全部重写：影院感的排版骨架 + 克制的粉青配色，深浅双主题都重新调过
            · 修复：播放器看不见播放/暂停按钮 —— media3 的 Player 没有 showControls 参数，
              控制层显隐由 centerControls 的 visible 参数控制，默认是「隐」；现在改为常驻
            · 修复：点「解析」后键盘不收起，挡住下面的结果
            · 修复：长分享文案在输入框里被横向裁切，看不到粘对了没
            · 修复：任务卡整卡可点，和内部的取消/重试图标抢点击
            · 修复：图标触摸区只有 32dp，容易点不中
            · 播放器新增「下载此视频」，不用关掉回首页重点
            · 下载任务改为一根细线进度，一屏能多看几条
            · 图集支持逐张挑选，实况图会连同动态一起保存

            ⚠️ 重要：从本版起使用固定签名密钥。
            由于之前每个版本的签名都是 CI 临时生成的（每次都不一样），
            **本版需要先卸载旧版再安装**。之后的所有版本都可以直接覆盖升级。

            · 播放器全新升级：进度条、播放控制、时间显示改为统一风格，操作更顺手
            · 播放界面更沉浸：全屏黑底，控制条自动隐藏，不遮挡画面
            · 视频预览卡片更精致：封面带渐变遮罩，时长与徽标不再压在画面上
            · 互动数据独立分区，信息层次更清楚
            · 支持完整分享文案：粘贴带杂质的抖音分享文字也能自动识别链接
            · 深浅主题切换加入平滑过渡，不再瞬间跳变
            · 支持跟随系统深色模式（也可手动锁定浅色或深色）
            · 浅色模式过渡更自然，不再有生硬的区块分界
            · 下载进度改为环形显示，不再重复出现两条进度
            · 统计区改为四宫格，数字与图标更清晰易读
            · 图集支持列表模式，可网格浏览、整屏查看、双指缩放
            · 机型显示为真实型号名称
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
