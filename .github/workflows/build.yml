name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          # 固定签名密钥：base64 存在 Secrets 里，构建时还原成 release-key.jks。
          # 不这么做的话，每个 runner 都会生成新的 ~/.android/debug.keystore，
          # 导致每个版本的签名都不同 —— 用户每次升级都得先卸载重装。
          DOUYIN_KEYSTORE_B64: ${{ secrets.DOUYIN_KEYSTORE_B64 }}
        run: |
          if [ -n "$DOUYIN_KEYSTORE_B64" ]; then
            echo "$DOUYIN_KEYSTORE_B64" | base64 -d > release-key.jks
            echo "::notice::已恢复固定签名密钥（$(stat -c%s release-key.jks) 字节）"
          else
            echo "::warning::DOUYIN_KEYSTORE_B64 未配置 —— 本次将使用 debug 签名，产物无法覆盖升级"
          fi

      - name: Build release APK
        env:
          # 云端同步接口密钥：不写进源码，从仓库 Secrets 注入 BuildConfig
          DOUYIN_SYNC_API_URL: ${{ secrets.DOUYIN_SYNC_API_URL }}
          DOUYIN_SYNC_API_KEY: ${{ secrets.DOUYIN_SYNC_API_KEY }}
          # 签名密钥口令（build.gradle.kts 从这两个环境变量读）
          DOUYIN_STORE_PASSWORD: ${{ secrets.DOUYIN_STORE_PASSWORD }}
          DOUYIN_KEY_PASSWORD: ${{ secrets.DOUYIN_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -z "$DOUYIN_SYNC_API_KEY" ]; then
            echo "::warning::DOUYIN_SYNC_API_KEY 未配置 —— 本次构建将不含云端同步（本地功能不受影响）"
          fi
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build_output.log

      - name: Show compile errors
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "(^e: |error:|FAILURE|What went wrong)" -A 3 build_output.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -60 build_output.log >> "$GITHUB_STEP_SUMMARY"
          # 把完整日志推到 error-report 分支供远程诊断
          git config user.name "ci-bot"
          git config user.email "ci@local"
          git checkout --orphan error-report
          git rm -rf --cached . -q || true
          git add -f build_output.log
          git commit -m "build log"
          git push -f origin error-report || true

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" app-release-v${GITHUB_REF_NAME#v}.apk || cp "$APK" app-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release*.apk
          # 手写更新日志：不使用自动生成（避免把内部实现细节带进用户可见的说明里）
          generate_release_notes: false
          body: |
            更新内容：

            · 主页布局优化：统计读数与输入区之间增加细线分隔，节奏更清晰
            · 分区标签统一为「中文 · 英文大写」格式：链接解析 PARSE / 最近解析 RECENT / 开始使用 START
            · 空状态引导卡与最近解析卡改为浅灰底 + 细线边框，与纸白背景过渡更自然
            · 标签与卡片统一 20dp 左右边距，不再贴屏幕边缘
            · 主页空状态：首次安装显示三步使用引导，有使用记录后显示最近解析 3 条（点击一键重新解析）
            · 页面切换动效：iPhone 风格缩放推入
            · 主题模式入口收敛到「设置」页
            · 设置页：主题模式、日志、关于；日志页：开关、复制、清空
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
