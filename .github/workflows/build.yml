name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          # 固定签名密钥：base64 存在 Secrets 里，构建时还原成 release-key.jks。
          # 不这么做的话，每个 runner 都会生成新的 ~/.android/debug.keystore，
          # 导致每个版本的签名都不同 —— 用户每次升级都得先卸载重装。
          DOUYIN_KEYSTORE_B64: ${{ secrets.DOUYIN_KEYSTORE_B64 }}
        run: |
          if [ -n "$DOUYIN_KEYSTORE_B64" ]; then
            echo "$DOUYIN_KEYSTORE_B64" | base64 -d > release-key.jks
            echo "::notice::已恢复固定签名密钥（$(stat -c%s release-key.jks) 字节）"
          else
            echo "::warning::DOUYIN_KEYSTORE_B64 未配置 —— 本次将使用 debug 签名，产物无法覆盖升级"
          fi

      - name: Build release APK
        env:
          # 云端同步接口密钥：不写进源码，从仓库 Secrets 注入 BuildConfig
          DOUYIN_SYNC_API_URL: ${{ secrets.DOUYIN_SYNC_API_URL }}
          DOUYIN_SYNC_API_KEY: ${{ secrets.DOUYIN_SYNC_API_KEY }}
          # 签名密钥口令（build.gradle.kts 从这两个环境变量读）
          DOUYIN_STORE_PASSWORD: ${{ secrets.DOUYIN_STORE_PASSWORD }}
          DOUYIN_KEY_PASSWORD: ${{ secrets.DOUYIN_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -z "$DOUYIN_SYNC_API_KEY" ]; then
            echo "::warning::DOUYIN_SYNC_API_KEY 未配置 —— 本次构建将不含云端同步（本地功能不受影响）"
          fi
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build_output.log

      - name: Show compile errors
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "(^e: |error:|FAILURE|What went wrong)" -A 3 build_output.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -60 build_output.log >> "$GITHUB_STEP_SUMMARY"
          # 把完整日志推到 error-report 分支供远程诊断
          git config user.name "ci-bot"
          git config user.email "ci@local"
          git checkout --orphan error-report
          git rm -rf --cached . -q || true
          git add -f build_output.log
          git commit -m "build log"
          git push -f origin error-report || true

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" app-release-v${GITHUB_REF_NAME#v}.apk || cp "$APK" app-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release*.apk
          # 手写更新日志：不使用自动生成（避免把内部实现细节带进用户可见的说明里）
          generate_release_notes: false
          body: |
            更新内容：

            · 视频起播更快：缓冲门槛从 2.5 秒降到 0.5 秒，并补上与下载链路一致的来源标识，预览不必再等空白画面
            · 全屏播放器：控制栏不再常驻画面正中，播放 3 秒后自动淡出，点画面唤出、再点收起
            · 播放器精简：画面中央只保留播放/暂停键，去掉快进快退；左上关闭按钮常驻
            · 图集选择：修复「全选」按钮挡住第 3 张图片勾选框、点不到的问题；类型标识与已选数量移到网格上方
            · 解析可取消：解析过程中左侧按钮变为「取消」，一点立即中断，不用再关掉 App 重开
            · 解析保护：超过 25 秒自动结束并说明原因；检测到没有网络时立即提示，不再空等
            · 解析进度：超过 8 秒会在按钮上显示已用秒数
            · 下载优化：加大写入缓冲、限制图集并发、降低进度回调频率，批量下载时界面不再发飘
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
