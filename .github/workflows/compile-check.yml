name: Compile Check

# 只给重构分支用：验证能否编译通过。
# 不打包、不签名、不发布、不碰 error-report 分支 —— 跟 build.yml 完全隔离，
# 免得重构过程中往 main 推东西触发正式构建。
on:
  push:
    branches:
      - 'refactor/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # compileSdk 37（libxposed 102 的要求），runner 自带 SDK 里没有
      - name: Install SDK 37
        run: |
          SDKM=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" -name sdkmanager -type f 2>/dev/null | head -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -5

      - name: Restore signing key
        env:
          DOUYIN_KEYSTORE_B64: ${{ secrets.DOUYIN_KEYSTORE_B64 }}
        run: |
          if [ -n "$DOUYIN_KEYSTORE_B64" ]; then
            echo "$DOUYIN_KEYSTORE_B64" | base64 -d > release-key.jks
          fi

      - name: Compile debug Kotlin
        env:
          DOUYIN_SYNC_API_URL: ${{ secrets.DOUYIN_SYNC_API_URL }}
          DOUYIN_SYNC_API_KEY: ${{ secrets.DOUYIN_SYNC_API_KEY }}
          DOUYIN_STORE_PASSWORD: ${{ secrets.DOUYIN_STORE_PASSWORD }}
          DOUYIN_KEY_PASSWORD: ${{ secrets.DOUYIN_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew compileDebugKotlin --stacktrace 2>&1 | tee compile.log

      - name: Show errors
        if: failure()
        run: |
          {
            echo "## 编译失败"
            echo '```'
            grep -E "(^e: |error:|FAILURE|What went wrong)" -A 3 compile.log | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
