<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>抖音下载器 - 界面预览</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .phone-frame {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 
                0 0 0 2px #333,
                0 0 0 4px #1a1a1a,
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 0 20px rgba(255,255,255,0.05);
            position: relative;
        }
        
        .phone-screen {
            width: 100%;
            height: 100%;
            background: #f5f5f5;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
        }
        
        .status-bar {
            height: 44px;
            background: #FE2C55;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }
        
        .status-bar-left {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .status-bar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-bar-right svg {
            width: 16px;
            height: 16px;
        }
        
        .notch {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 28px;
            background: #000;
            border-radius: 0 0 16px 16px;
            z-index: 100;
        }
        
        .app-bar {
            background: linear-gradient(135deg, #FE2C55 0%, #ff4d6d 100%);
            padding: 16px 16px 20px;
            color: white;
        }
        
        .app-bar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .app-bar-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
        }
        
        .app-bar-title .icon {
            width: 28px;
            height: 28px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .app-bar-title .icon svg {
            width: 18px;
            height: 18px;
            fill: #FE2C55;
        }
        
        .app-bar-actions {
            display: flex;
            gap: 8px;
        }
        
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .icon-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .icon-btn svg {
            width: 22px;
            height: 22px;
        }
        
        .content {
            padding: 16px;
            height: calc(100% - 44px - 76px);
            overflow-y: auto;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-title svg {
            width: 20px;
            height: 20px;
            fill: #FE2C55;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        
        .input-field {
            width: 100%;
            padding: 16px 48px 16px 48px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            background: #fafafa;
        }
        
        .input-field:focus {
            border-color: #FE2C55;
            background: white;
            box-shadow: 0 0 0 4px rgba(254, 44, 85, 0.1);
        }
        
        .input-field::placeholder {
            color: #999;
        }
        
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: #FE2C55;
        }
        
        .input-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e0e0e0;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .input-group:hover .input-clear {
            opacity: 1;
        }
        
        .input-clear svg {
            width: 14px;
            height: 14px;
            fill: #666;
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FE2C55 0%, #ff4d6d 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(254, 44, 85, 0.5);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-primary svg {
            width: 20px;
            height: 20px;
        }
        
        .video-preview {
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
        }
        
        .video-cover {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .video-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .play-btn {
            width: 64px;
            height: 64px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        
        .play-btn:hover {
            background: rgba(254, 44, 85, 0.8);
            transform: scale(1.1);
        }
        
        .play-btn svg {
            width: 32px;
            height: 32px;
            fill: white;
            margin-left: 4px;
        }
        
        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #FE2C55 0%, #ff6b81 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(254, 44, 85, 0.4);
        }
        
        .video-info {
            padding: 16px 0;
        }
        
        .video-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .video-author {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 14px;
        }
        
        .video-author svg {
            width: 16px;
            height: 16px;
            fill: #999;
        }
        
        .btn-download {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #25F4EE 0%, #00BCD4 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(37, 244, 238, 0.4);
        }
        
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 244, 238, 0.5);
        }
        
        .btn-download svg {
            width: 20px;
            height: 20px;
            fill: #1a1a2e;
        }
        
        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .task-item:last-child {
            border-bottom: none;
        }
        
        .task-thumb {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        
        .task-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .task-info {
            flex: 1;
            min-width: 0;
        }
        
        .task-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        
        .task-status {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #999;
        }
        
        .task-status svg {
            width: 14px;
            height: 14px;
        }
        
        .task-status.completed svg {
            fill: #4CAF50;
        }
        
        .task-status.downloading svg {
            fill: #FE2C55;
        }
        
        .task-progress {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .task-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #FE2C55 0%, #ff6b81 100%);
            border-radius: 3px;
            transition: width 0.3s;
        }
        
        .task-close {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #f0f0f0;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .task-close svg {
            width: 14px;
            height: 14px;
            fill: #999;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title svg {
            width: 20px;
            height: 20px;
            fill: #FE2C55;
        }
        
        /* Demo states */
        .demo-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        
        .demo-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .demo-btn.pink {
            background: #FE2C55;
            color: white;
        }
        
        .demo-btn.cyan {
            background: #25F4EE;
            color: #1a1a2e;
        }
        
        .demo-btn.gray {
            background: #e0e0e0;
            color: #333;
        }
        
        .demo-btn:hover {
            transform: translateY(-2px);
        }
        
        /* Animation */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-in {
            animation: slideUp 0.4s ease-out;
        }
        
        /* Hide scrollbar */
        .content::-webkit-scrollbar {
            width: 0;
        }
        
        /* Preview states */
        .preview-section {
            display: none;
        }
        
        .preview-section.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="phone-screen">
            <div class="notch"></div>
            
            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-bar-left">
                    <span>9:41</span>
                </div>
                <div class="status-bar-right">
                    <svg viewBox="0 0 24 24" fill="white"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
                    <svg viewBox="0 0 24 24" fill="white"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
                </div>
            </div>
            
            <!-- App Bar -->
            <div class="app-bar">
                <div class="app-bar-content">
                    <div class="app-bar-title">
                        <div class="icon">
                            <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
                        </div>
                        <span>抖音下载器</span>
                    </div>
                    <div class="app-bar-actions">
                        <button class="icon-btn">
                            <svg viewBox="0 0 24 24" fill="white"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                        </button>
                        <button class="icon-btn">
                            <svg viewBox="0 0 24 24" fill="white"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Content -->
            <div class="content">
                <!-- State 1: Input -->
                <div class="preview-section active" id="state-input">
                    <div class="card animate-in">
                        <div class="card-title">
                            <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
                            粘贴视频链接
                        </div>
                        <div class="input-group">
                            <svg class="input-icon" viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
                            <input type="text" class="input-field" placeholder="请输入或粘贴抖音视频链接..." id="url-input">
                            <button class="input-clear">
                                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                            </button>
                        </div>
                        <button class="btn-primary" onclick="showState('state-loading')">
                            <svg viewBox="0 0 24 24" fill="white"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                            解析视频
                        </button>
                    </div>
                </div>
                
                <!-- State 2: Loading -->
                <div class="preview-section" id="state-loading">
                    <div class="card animate-in">
                        <div class="card-title">
                            <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
                            粘贴视频链接
                        </div>
                        <div class="input-group">
                            <svg class="input-icon" viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
                            <input type="text" class="input-field" value="https://v.douyin.com/xxxxxxx" disabled>
                        </div>
                        <button class="btn-primary loading" disabled>
                            <svg viewBox="0 0 24 24" fill="white" class="spinning"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8c-.45-.83-.7-1.79-.7-2.8 0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg>
                            解析中...
                        </button>
                    </div>
                </div>
                
                <!-- State 3: Preview -->
                <div class="preview-section" id="state-preview">
                    <div class="card animate-in">
                        <div class="card-title">
                            <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
                            粘贴视频链接
                        </div>
                        <div class="input-group">
                            <svg class="input-icon" viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
                            <input type="text" class="input-field" placeholder="请输入或粘贴抖音视频链接...">
                        </div>
                        <button class="btn-primary" onclick="showState('state-loading')">
                            <svg viewBox="0 0 24 24" fill="white"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                            解析视频
                        </button>
                    </div>
                    
                    <div class="card animate-in" style="animation-delay: 0.1s;">
                        <div class="video-preview">
                            <div class="video-cover">
                                <img src="https://picsum.photos/400/200?random=1" alt="视频封面">
                                <div class="play-btn">
                                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                </div>
                                <div class="badge">无水印</div>
                            </div>

    <script>
        function showState(stateId) {
            // Hide all sections
            document.querySelectorAll('.preview-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // Show target section
            document.getElementById(stateId).classList.add('active');
        }
        
        // Simulate progress animation
        let progress = 68;
        setInterval(() => {
            const progressBar = document.querySelector('.task-progress-bar');
            if (progressBar && document.getElementById('state-downloading').classList.contains('active')) {
                progress = Math.min(progress + 1, 100);
                progressBar.style.width = progress + '%';
                
                const statusText = document.querySelector('.task-status.downloading span');
                if (statusText) {
                    statusText.textContent = `下载中 ${progress}%`;
                }
                
                if (progress >= 100) {
                    setTimeout(() => showState('state-completed'), 500);
                    progress = 68;
                }
            }
        }, 100);
    </script>
